[package]
name = "hachi-co"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Prototype of the Hachi lattice-based multilinear polynomial commitment scheme, and of its collaborative variant Hachi-Co"
readme = "README.md"

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex-header.html"]

[dependencies]
ark-ff = "0.6.0"
ark-poly = "0.6.0"
ark-std = "0.6.0"
base64 = "0.23.1"
memmap2 = "0.9.11"
rand = "0.10.3"
rand_chacha = "0.10.0"
sha256 = "1.6.0"
tfhe-ntt = "0.7.1"
time-graph = "0.3.3"

[features]
default = ["verbose"]
verbose = []
gen_file = []
stats = []
nightly = ["tfhe-ntt/avx512"]

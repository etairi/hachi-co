[package]
name = "hachi-co-greyhound"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Greyhound (Nguyen and Seiler, CRYPTO 2024): commitments to polynomials over Z_q, evaluation proofs reduced to LaBRADOR's principal relation, and the LaBRADOR proof of that relation by jali"
publish = false

[dependencies]
hachi-co-math.workspace = true
hachi-co-sampling.workspace = true
hachi-co-transcript.workspace = true
# jali 0.3.1 was the first release that takes LaBRADOR moduli up to 2^62 (0.3.0 stopped at 2^48),
# and 0.3.2 has the same code.
jali = { version = "0.3.2", features = ["parallel"] }
rand.workspace = true
rayon.workspace = true
thiserror.workspace = true

[dev-dependencies]
# For the cross-check of the tail's value with Hachi's `table_eval`.
hachi.workspace = true

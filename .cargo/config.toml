# `cargo docs` documents every workspace crate (including private items) with the KaTeX header
# (katex-header.html) that renders the equations in the doc comments; `cargo docs-open` also opens
# the result. The header is passed through `--config` only for these aliases and only to the
# workspace's own crates (`--no-deps`), so a plain `cargo doc` keeps working.
[alias]
docs = ["doc", "--workspace", "--no-deps", "--document-private-items", "--config", "build.rustdocflags=[\"--html-in-header\",\"katex-header.html\"]"]
docs-open = ["doc", "--workspace", "--no-deps", "--document-private-items", "--open", "--config", "build.rustdocflags=[\"--html-in-header\",\"katex-header.html\"]"]
